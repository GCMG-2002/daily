<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手机扫码 · 日常</title>
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23111518'/%3E%3Ctext x='50' y='71' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E6%97%A5%3C/text%3E%3C/svg%3E" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
    background:radial-gradient(900px 600px at 50% -10%,#e8eef8 0%,#f2f4f7 55%,#eceff4 100%);
    color:#11161c;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .card{
    width:100%;max-width:460px;background:#fff;border-radius:24px;padding:32px 30px 26px;
    box-shadow:0 24px 60px rgba(17,22,28,.12);text-align:center;
  }
  .brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
  .brand i{
    width:36px;height:36px;border-radius:11px;background:#11161c;color:#fff;
    display:grid;place-items:center;font-size:18px;font-weight:700;font-style:normal;
  }
  .brand b{font-size:18px;letter-spacing:.06em}
  h1{margin:2px 0 8px;font-size:24px;font-weight:700;letter-spacing:-.01em}
  .sub{margin:0 0 20px;font-size:13px;line-height:1.7;color:#8b95a3}
  .qr{
    width:min(280px,70vw);margin:0 auto;background:#fff;border:1px solid #e8eaef;border-radius:18px;padding:14px;
  }
  .qr svg{display:block;width:100%;height:auto;border-radius:6px}
  .addr{
    margin:18px auto 0;display:flex;align-items:center;gap:8px;justify-content:center;
    background:#f4f6f9;border:1px solid #e8eaef;border-radius:12px;padding:10px 14px;
  }
  .addr code{font-size:13px;color:#3f4854;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .addr button{
    flex:none;border:0;background:#2f6bef;color:#fff;border-radius:8px;padding:5px 10px;
    font-size:11.5px;cursor:pointer;
  }
  ol{margin:22px 0 0;padding:0 0 0 18px;text-align:left;color:#5c6672;font-size:12.5px;line-height:2}
  .btn{
    display:inline-block;margin-top:20px;padding:10px 22px;border-radius:999px;
    background:#2f6bef;color:#fff;text-decoration:none;font-size:12.5px;font-weight:600;
  }
  .foot{margin:20px 0 0;font-size:11px;color:#a4adba}
  .warn{display:none;margin:18px auto 0;padding:12px 14px;border-radius:12px;background:#fff6e8;color:#9a6414;font-size:12.5px;line-height:1.7;text-align:left}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><i>日</i><b>日常</b></div>
  <h1>手机扫一扫</h1>
  <p class="sub">这是云端地址，手机用流量、在外地都能打开，<br>和电脑看到的是同一份记录。</p>
  <div class="qr" id="qr">正在生成二维码…</div>
  <div class="addr"><code id="addr">正在获取地址…</code><button id="copy" type="button">复制</button></div>
  <div class="warn" id="warn">请先把这个文件夹部署到网上（Netlify 等），得到公开网址后再打开本页扫码。</div>
  <ol>
    <li>手机相机或浏览器扫描二维码</li>
    <li>打开后在浏览器里「添加到主屏幕」</li>
    <li>以后点桌面图标，随时都能用</li>
  </ol>
  <a class="btn" href="./">进入日常</a>
  <p class="foot">数据存在云端，手机和电脑自动同步</p>
</main>
<script src="vendor-qrcode.js"></script>
<script>
(function(){
  var url = location.origin;
  var addrEl = document.getElementById('addr');
  var qrEl = document.getElementById('qr');
  var warn = document.getElementById('warn');

  function draw(u){
    try {
      var qr = window.qrcode(0, 'M');
      qr.addData(u, 'Byte');
      qr.make();
      qrEl.innerHTML = qr.createSvgTag({ cellSize: 8, margin: 1, scalable: true, alt: '手机打开日常的二维码' });
    } catch (err) {
      qrEl.textContent = '二维码生成失败，请手动输入地址';
    }
  }

  if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    warn.style.display = 'block';
    qrEl.textContent = '部署到网上后再扫码';
    addrEl.textContent = '尚未部署';
    return;
  }
  if (/^https?:$/.test(location.protocol) && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    warn.style.display = 'block';
    warn.textContent = '现在是本机预览地址，手机打不开。部署到 Netlify 后，用公开网址打开本页再扫码。';
  }

  draw(url);
  addrEl.textContent = url;

  document.getElementById('copy').addEventListener('click', function(){
    var btn = this;
    function done(){ btn.textContent = '已复制'; setTimeout(function(){ btn.textContent = '复制'; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(function(){});
    } else {
      var t = document.createElement('textarea');
      t.value = url; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      t.remove();
    }
  });
})();
</script>
</body>
</html>
